[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "residual_controllers"
version = "0.1.0"
description = "Residual RL for improving controllers in POMDPs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "matplotlib",
    "gymnasium==0.29.1",
    "stable-baselines3==2.6.0",
    "pyyaml>=6.0.2",
    "tabulate>=0.9.0",
    "tensorboard>=2.18.0",
    "pybullet>=3.2.5",
    "pybullet_helpers@git+https://github.com/Princeton-Robot-Planning-and-Learning/prpl-mono.git#subdirectory=pybullet-helpers",
    "tomsgeoms2d@git+https://github.com/Princeton-Robot-Planning-and-Learning/prpl-mono.git#subdirectory=toms-geoms-2d",
    "relational_structs@git+https://github.com/Princeton-Robot-Planning-and-Learning/prpl-mono.git#subdirectory=relational-structs",
    "bilevel_planning@git+https://github.com/Princeton-Robot-Planning-and-Learning/prpl-mono.git@26e0f18a9899f13773b81e7fc1f6229233d7b121#subdirectory=bilevel-planning",
    "prpl_utils@git+https://github.com/Princeton-Robot-Planning-and-Learning/prpl-mono.git#subdirectory=prpl-utils",
]

[project.optional-dependencies]
develop = [
    "black",
    "docformatter",
    "isort",
    "mypy",
    "pylint>=2.14.5",
    "pytest-pylint>=0.18.0",
    "pytest>=7.2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
residual_controllers = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
py_version = 311
profile = "black"
multi_line_output = 2
skip_glob = ["venv/*"]
split_on_trailing_comma = true

[tool.pylint.main]
# No ignore paths needed

[tool.mypy]
strict_equality = true
disallow_untyped_calls = true
warn_unreachable = true
exclude = ["venv/*", "experiments/*"]

[[tool.mypy.overrides]]
module = [
    "matplotlib.*",
    "gymnasium.*",
    "stable_baselines3.*",
    "pybullet.*",
    "pybullet_helpers.*",
    "scipy.*",
    "numba.*",
    "tomsgeoms2d.*",
    "relational_structs.*",
    "bilevel_planning.*",
    "prpl_utils.*",
]
ignore_missing_imports = true
